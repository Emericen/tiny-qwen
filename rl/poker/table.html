<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tiny-qwen poker</title>
<style>
  :root { --felt: #0e4d28; --rim: #083318; --pod: #08351b; --ink: #e8f2ea; --dim: #9fc4aa; --gold: #face0a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #071d10; color: var(--ink); min-height: 100vh;
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
         display: flex; flex-direction: column; align-items: center; padding: 24px 12px; }
  #table { position: relative; width: min(720px, 96vw); background: var(--felt);
           border: 6px solid var(--rim); border-radius: 130px; padding: 20px 34px; overflow: hidden; }
  .zone { display: flex; flex-direction: column; align-items: center; gap: 7px; }
  .seat { display: flex; align-items: center; gap: 8px; font-size: 13px; min-height: 20px; }
  .seat .stack { color: var(--dim); font-size: 12px; display: flex; align-items: center; gap: 4px; }
  .chip-s { width: 11px; height: 11px; border-radius: 50%; background: #c94f4f;
            border: 1.5px dashed rgba(255,255,255,.85); display: inline-block; flex: none; }
  .seat.acting .name { color: #4ade80; }
  .btn-d { width: 16px; height: 16px; border-radius: 50%; background: #f2f0e6; color: #333;
           font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .cards { display: flex; gap: 5px; }
  .card { width: 40px; height: 56px; border-radius: 5px; background: #fff;
          display: flex; align-items: center; justify-content: center; flex-direction: column;
          font-size: 15px; font-weight: 600; color: #1c1c1c; line-height: 1; gap: 1px; }
  .card.red { color: #c0392b; }
  .card.big { width: 46px; height: 64px; font-size: 17px; }
  .card.back { background: #1d5f8a; border: 2px solid #fff; position: relative; }
  .card.back::after { content: ""; position: absolute; inset: 4px; border: 1.5px solid #6ea3c4; border-radius: 3px; }
  .card.slot { background: none; border: 1.5px dashed #2c7a4a; }
  .money { display: flex; align-items: center; gap: 7px; min-height: 24px; font-size: 14px; }
  .chip { width: 20px; height: 20px; border-radius: 50%; background: #c94f4f;
          border: 2.5px dashed rgba(255,255,255,.85); flex: none; }
  .chip + .chip { margin-left: -14px; }
  #center { display: flex; flex-direction: column; align-items: center; gap: 9px; margin: 12px 0; }
  #controls { display: flex; align-items: stretch; justify-content: center; gap: 6px;
              flex-wrap: wrap; margin-top: 16px; min-height: 46px; width: min(720px, 96vw); }
  #controls button { border: 0; border-radius: 8px; padding: 7px 14px; font-size: 13px;
                     color: #fff; cursor: pointer; font-family: inherit; line-height: 1.25; }
  #controls button:hover { filter: brightness(1.15); }
  #controls button small { display: block; font-size: 11px; opacity: .85; font-weight: 400; }
  .a-fold { background: #8a2c2c; } .a-check, .a-call { background: #2c6a8a; }
  .a-raise { background: #2c8a4a; } .a-allin { background: #5a5a5a; } .a-next { background: #6a5a1c; }
  #layout { display: flex; gap: 14px; align-items: flex-start; justify-content: center; }
  #left { display: flex; flex-direction: column; }
  #chat-wrap { width: 270px; display: none; flex-direction: column;
               background: #06240f; border-radius: 14px; padding: 10px 12px; }
  #chat { flex: 1; min-height: 0; overflow-y: auto; font-size: 12px; color: var(--ink);
          display: flex; flex-direction: column; gap: 3px; padding: 2px 4px;
          scrollbar-width: thin; scrollbar-color: #1d5f35 transparent; }
  #chat::-webkit-scrollbar { width: 6px; }
  #chat::-webkit-scrollbar-track { background: transparent; }
  #chat::-webkit-scrollbar-thumb { background: #1d5f35; border-radius: 3px; }
  #chat::-webkit-scrollbar-thumb:hover { background: #2c7a4a; }
  @media (max-width: 1080px) {
    #layout { flex-direction: column; align-items: center; }
    #chat-wrap { width: min(720px, 96vw); }
    #chat { flex: none; max-height: 140px; }
  }
  #chat b { color: var(--gold); font-weight: 600; }
  #chat .deal { color: #4ade80; opacity: .8; }
  #chat .act { color: var(--dim); }
  #chat-row { display: none; gap: 6px; margin-top: 6px; }
  #chat-in { font-family: inherit; font-size: 12px; border: 0; border-radius: 8px; padding: 8px 10px;
             flex: 1; min-width: 0; background: #0d2f1c; color: var(--ink); }
  #chat-in::placeholder { color: #587f66; }
  #chat-send { border: 0; border-radius: 8px; padding: 8px 12px; font-size: 12px; font-family: inherit;
               background: #2c8a4a; color: #fff; cursor: pointer; }
  #chat-send:hover { filter: brightness(1.15); }
</style>
<div id="layout">
<div id="left">
<div id="table">
  <div class="zone" id="top-zone">
    <div class="cards" id="top-cards"></div>
    <div class="seat" id="top-pod"></div>
    <div class="money" id="top-bet"></div>
  </div>
  <div id="center">
    <div class="money" id="pot"></div>
    <div class="cards" id="board"></div>
  </div>
  <div class="zone" id="bottom-zone">
    <div class="money" id="bottom-bet"></div>
    <div class="seat" id="bottom-pod"></div>
    <div class="cards" id="bottom-cards"></div>
  </div>
</div>
<div id="controls"></div>
</div>
<div id="chat-wrap">
  <div id="chat"></div>
  <div id="chat-row">
    <input id="chat-in" placeholder="table talk…">
    <button id="chat-send">Send</button>
  </div>
</div>
</div>
<script>
const SUIT = { s: "♠", h: "♥", d: "♦", c: "♣" };
let chatLen = -1;

function el(id) { return document.getElementById(id); }

function cardHtml(c, big) {
  const cls = "card" + (big ? " big" : "");
  if (c === "?") return `<div class="${cls} back"></div>`;
  const rank = c[0] === "T" ? "10" : c[0], suit = c[1];
  const red = "hd".includes(suit) ? " red" : "";
  return `<div class="${cls}${red}"><span>${rank}</span><span>${SUIT[suit]}</span></div>`;
}

function chips(n) {
  const count = n <= 8 ? 1 : n <= 40 ? 2 : 3;
  return `<span class="chip"></span>`.repeat(count) + `<span>${n}</span>`;
}

function seatHtml(s, seat) {
  const acting = !s.done && s.to_act === seat ? " acting" : "";
  const btn = s.button === seat ? `<span class="btn-d">D</span>` : "";
  return `<div class="seat${acting}">${btn}<span class="name">${s.names[seat]}</span><span class="stack"><span class="chip-s"></span>${s.stacks[seat]}</span></div>`;
}

function render(s) {
  const me = s.human ?? 0, opp = 1 - me;

  el("top-cards").innerHTML = s.hole[opp].map(c => cardHtml(c, false)).join("");
  el("top-pod").outerHTML = seatHtml(s, opp).replace('class="seat', 'id="top-pod" class="seat');
  el("top-bet").innerHTML = s.bets[opp] ? chips(s.bets[opp]) : "";

  el("pot").innerHTML = s.pot ? chips(s.pot) : "";
  el("board").innerHTML =
    s.board.map(c => cardHtml(c, false)).join("") +
    `<div class="card slot"></div>`.repeat(5 - s.board.length);
  el("bottom-bet").innerHTML = s.bets[me] ? chips(s.bets[me]) : "";
  el("bottom-pod").outerHTML = seatHtml(s, me).replace('class="seat', 'id="bottom-pod" class="seat');
  el("bottom-cards").innerHTML = s.hole[me].map(c => cardHtml(c, true)).join("");

  const controls = el("controls");
  if (s.done) {
    controls.innerHTML = s.watch ? "" : `<button class="a-next" onclick="post('new')">Next hand</button>`;
  } else if (s.your_turn) {
    controls.innerHTML = s.legal.map(a => {
      const cls = a.action === "fold" ? "a-fold" : a.action === "allin" ? "a-allin"
        : a.action === "check" || a.action === "call" ? "a-" + a.action : "a-raise";
      const n = a.n !== null && a.label !== "Call" ? `<small>${a.n}</small>` : "";
      const label = a.label === "Call" ? `Call ${a.n}` : a.label;
      return `<button class="${cls}" onclick="play('${a.action}')">${label}${n}</button>`;
    }).join("");
  } else {
    controls.innerHTML = "";
  }

  el("chat-wrap").style.display = s.talk || s.chat.length ? "flex" : "none";
  // the left column (table + buttons) is the height authority; the thread scrolls inside it
  const wrapH = window.matchMedia("(min-width: 1081px)").matches
    ? el("left").offsetHeight + "px" : "";
  const resized = el("chat-wrap").style.height !== wrapH;
  el("chat-wrap").style.height = wrapH;
  el("chat-row").style.display = s.talk && s.human !== null ? "flex" : "none";
  if (s.chat.length !== chatLen || resized) {
    chatLen = s.chat.length;
    el("chat").innerHTML = s.chat.map(m =>
      m.kind === "deal"  ? `<div class="deal">${m.text}</div>` :
      m.kind === "score" ? `<div class="act">${m.text}</div>` :
      m.kind === "act"   ? `<div class="act">${m.who} · ${m.text}</div>` :
                           `<div><b>${m.who}:</b> ${m.text}</div>`
    ).join("");
    el("chat").scrollTop = el("chat").scrollHeight;
  }
}

async function play(action) {
  await fetch("act", { method: "POST", headers: { "Content-Type": "application/json" },
                       body: JSON.stringify({ action }) });
}

async function post(path) {
  await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
}

async function sendChat() {
  const box = el("chat-in"), text = box.value.trim();
  if (!text) return;
  box.value = "";
  await fetch("chat", { method: "POST", headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ text }) });
}
el("chat-in").addEventListener("keydown", e => { if (e.key === "Enter") sendChat(); });
el("chat-send").addEventListener("click", sendChat);

// the stream: the server pushes a snapshot on every game event
new EventSource("events").onmessage = (e) => render(JSON.parse(e.data));
</script>
